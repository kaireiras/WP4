services:
  db:
    image: docker.io/library/mysql:latest
    container_name: crowd-detection-mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_DATABASE: ${DB_DATABASE:-pmld}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pmld_mysql_data:/var/lib/mysql:Z
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    networks:
      - pmld-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: docker.io/phpmyadmin:latest
    container_name: crowd-detection-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_HOST_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pmld-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: crowd-detection-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NITRO_PORT=3000
      - SERVER_URL=http://backend
      - VITE_ENV=${VITE_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pmld-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowd-detection-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:80"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-pmld}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - BROADCAST_CONNECTION=reverb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pmld-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowd-detection-reverb
    restart: always
    command: ["reverb"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-pmld}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - BROADCAST_CONNECTION=reverb
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - pmld-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crowd-detection-queue
    restart: always
    command: ["queue"]
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-pmld}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - BROADCAST_CONNECTION=reverb
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - pmld-net
    healthcheck:
      disable: true

volumes:
  pmld_mysql_data:

networks:
  pmld-net:
    external: true
